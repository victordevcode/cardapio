services:
  - type: web
    name: lanches-da-ju
    env: node
    plan: free
    # Entra na pasta backend, instala as dependências, depois vai na pasta frontend e faz o build
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: node backend/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false